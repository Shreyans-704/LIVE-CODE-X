<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.5)) drop-shadow(0 0 10px rgba(147, 51, 234, 0.3)); }
        50% { filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8)) drop-shadow(0 0 20px rgba(147, 51, 234, 0.6)); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .neon-icon {
        animation: glow 3s ease-in-out infinite, float 4s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="none"/>
  
  <!-- Neon rounded square border -->
  <rect x="30" y="30" width="140" height="140" rx="20" ry="20" 
        fill="none" stroke="url(#glowGradient)" stroke-width="2.5"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.9"/>
  
  <!-- Left bracket < -->
  <path d="M 75 75 L 60 100 L 75 125" 
        fill="none" stroke="url(#glowGradient)" stroke-width="3" 
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.95"/>
  
  <!-- Right bracket > -->
  <path d="M 125 75 L 140 100 L 125 125" 
        fill="none" stroke="url(#glowGradient)" stroke-width="3" 
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.95"/>
  
  <!-- Center vertical lines -->
  <line x1="95" y1="80" x2="95" y2="95" 
        stroke="url(#glowGradient)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.85"/>
  
  <line x1="100" y1="75" x2="100" y2="100" 
        stroke="url(#glowGradient)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.9"/>
  
  <line x1="105" y1="80" x2="105" y2="95" 
        stroke="url(#glowGradient)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.85"/>
  
  <!-- Upward arrow -->
  <path d="M 100 105 L 100 125 M 95 120 L 100 125 L 105 120" 
        fill="none" stroke="url(#glowGradient)" stroke-width="2.5" 
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" class="neon-icon" opacity="0.9"/>
  
  <!-- Decorative dots -->
  <circle cx="65" cy="55" r="3" fill="url(#glowGradient)" 
          filter="url(#neonGlow)" class="neon-icon" opacity="0.8"/>
  <circle cx="135" cy="145" r="3" fill="url(#glowGradient)" 
          filter="url(#neonGlow)" class="neon-icon" opacity="0.8"/>
  <circle cx="145" cy="100" r="2.5" fill="url(#glowGradient)" 
          filter="url(#neonGlow)" class="neon-icon" opacity="0.7"/>
</svg>